{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.nats.namespace }}
  labels:
    ktc.io/part-of: ktc
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: {{ .Values.nats.namespace }}
data:
  nats.conf: |
    port: 4222
    http: 8222
    jetstream {
      store_dir: /data
      max_mem: 1G
      max_file: 10G
    }
    cluster {
      name: ktc-nats
      port: 6222
      routes: [
{{- $replicas := int .Values.nats.replicas }}
{{- range $i, $_ := until $replicas }}
        nats://nats-{{ $i }}.nats.{{ $.Values.nats.namespace }}.svc.cluster.local:6222
{{- end }}
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: {{ .Values.nats.namespace }}
  labels:
    app.kubernetes.io/name: nats
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: 4222
    - name: monitor
      port: 8222
      targetPort: 8222
    - name: cluster
      port: 6222
      targetPort: 6222
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: {{ .Values.nats.namespace }}
spec:
  serviceName: nats
  replicas: {{ .Values.nats.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      nodeSelector:
        ktc.role: db
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          args: ["-c", "/etc/nats/nats.conf"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
            - containerPort: 6222
              name: cluster
          volumeMounts:
            - name: config
              mountPath: /etc/nats
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.nats.storageClassName }}
        storageClassName: {{ .Values.nats.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.storage }}
{{- end }}
