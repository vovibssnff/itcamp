    secret_key        = "ktcminio_secret"
    use_ssl           = false
    region            = "us-east-1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: report-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "30s"
