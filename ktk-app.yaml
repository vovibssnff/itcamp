    min_conns         = 2
    conn_timeout      = "5s"
    query_timeout     = "5s"

    [seed]
    enabled           = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "30s"
    shutdown_timeout  = "15s"

    [db]
    dsn               = "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
    max_conns         = 10
    min_conns         = 2
    conn_timeout      = "5s"
    query_timeout     = "5s"

    [redis]
    addr              = "radix:7379"
    password          = ""
    db                = 0

    [nats]
    url               = "nats://nats:4222"

    [clients]
    constructor_url   = "http://constructor:8080"
    scenario_url      = "http://scenario:8080"
    sim_url           = "http://sim-worker:8081"
    assessment_url    = "http://assessment:8080"
    snapshot_url      = "http://snapshot:8080"

    [telemetry]
    hz                = 1.0
    tick_timeout      = "2s"
---
