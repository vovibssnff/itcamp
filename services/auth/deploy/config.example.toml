# Конфигурация auth-сервиса
# Формат: TOML. Путь передаётся через флаг -config (по умолчанию ./config.toml)
# Секреты (dsn, signing_key, bind_password) можно перекрыть env-переменными:
#   AUTH_DB_DSN, AUTH_JWT_SIGNING_KEY, AUTH_LDAP_BIND_PASSWORD, AUTH_LDAP_URL

[http]
addr              = ":8080"
read_timeout      = "10s"
write_timeout     = "10s"
shutdown_timeout  = "15s"

[db]
dsn               = "postgres://picodata:picodata@localhost:5432/ktc?sslmode=disable"
max_conns         = 10
min_conns         = 2
conn_timeout      = "5s"
query_timeout     = "5s"

[jwt]
signing_key       = "change-me-to-32-bytes-secret-key-xxxxxx"
signing_method    = "HS256"
access_ttl        = "15m"
refresh_ttl       = "24h"
issuer            = "ktc-auth"

# Режим аутентификации: "ldap" (prod) или "stub" (dev без LDAP)
[auth]
mode              = "ldap"

# Тестовые пользователи для stub-режима (mode = "stub")
# [[auth.stub_users]]
# login    = "admin"
# password = "admin123"
# full_name = "Администратор"
# roles    = ["admin"]
#
# [[auth.stub_users]]
# login    = "instructor"
# password = "instructor123"
# full_name = "Инструктор"
# roles    = ["instructor"]
#
# [[auth.stub_users]]
# login    = "operator"
# password = "operator123"
# full_name = "Оператор"
# roles    = ["operator"]

[ldap]
url               = "ldaps://dc01.corp.example.ru:636"
bind_dn           = "CN=svc-ktc,OU=ServiceAccounts,DC=corp,DC=example,DC=ru"
bind_password     = ""
base_dn           = "DC=corp,DC=example,DC=ru"
user_filter       = "(sAMAccountName=%s)"
group_attr        = "memberOf"
start_tls         = true
skip_verify       = false
timeout           = "5s"
admin_group       = "CN=ktc-admins,OU=Groups,DC=corp,DC=example,DC=ru"
instructor_group  = "CN=ktc-instructors,OU=Groups,DC=corp,DC=example,DC=ru"
operator_group    = "CN=ktc-operators,OU=Groups,DC=corp,DC=example,DC=ru"

[pam]
enabled           = false
endpoint          = "https://pam.ktc-app.svc.cluster.local"

[security]
password_min_len   = 8
lockout_threshold  = 5
lockout_window     = "15m"
lockout_duration   = "30m"
auth_rate_limit    = 10
rate_limit_window  = "1m"
