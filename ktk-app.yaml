---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "30s"
    shutdown_timeout  = "15s"

    [auth_client]
    url               = "http://auth:8080/introspect"
    timeout           = "3s"
    cache_ttl         = "30s"
    cache_max_size    = 1000

    [security]
    rate_limit_per_min = 2000

    [upstreams.auth]
    url = "http://auth:8080"

    [upstreams.constructor]
    url = "http://constructor:8080"

    [upstreams.scenario]
    url = "http://scenario:8080"

    [upstreams.orchestrator]
    url = "http://orchestrator:8080"

    [upstreams.assessment]
    url = "http://assessment:8080"

    [upstreams.snapshot]
    url = "http://snapshot:8080"

    [upstreams.report]
    url = "http://report:8080"

    [upstreams.ai]
    url = "http://ai:8080/v1"

    [[routes]]
    prefix       = "/api/v1/auth/login"
    upstream     = "auth"
    strip_prefix = "/api/v1/auth"
    auth         = false

    [[routes]]
    prefix       = "/api/v1/auth/refresh"
    upstream     = "auth"
    strip_prefix = "/api/v1/auth"
    auth         = false

    [[routes]]
    prefix       = "/api/v1/auth/mfa/enrollment"
    upstream     = "auth"
    strip_prefix = "/api/v1/auth"
    auth         = false

    [[routes]]
    prefix       = "/api/v1/auth"
    upstream     = "auth"
    strip_prefix = "/api/v1/auth"
    auth         = true

    [[routes]]
    prefix       = "/api/v1/users"
    upstream     = "auth"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["admin", "instructor"]

    [[routes]]
    prefix       = "/api/v1/components"
    upstream     = "constructor"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin", "operator"]

    [[routes]]
    prefix       = "/api/v1/templates"
    upstream     = "constructor"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin", "operator"]

    [[routes]]
    prefix       = "/api/v1/scenarios"
    upstream     = "scenario"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin"]

    [[routes]]
    prefix       = "/api/v1/faults"
    upstream     = "scenario"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin"]

    [[routes]]
    prefix       = "/api/v1/sessions"
    upstream     = "orchestrator"
    strip_prefix = "/api/v1"
    auth         = true

    [[routes]]
    prefix       = "/api/v1/assessment"
    upstream     = "assessment"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin", "operator"]

    [[routes]]
    prefix       = "/api/v1/snapshots"
    upstream     = "snapshot"
    strip_prefix = "/api/v1"
    auth         = true
    roles        = ["instructor", "admin"]

    [[routes]]
    prefix       = "/api/v1/reports"
    upstream     = "report"
    strip_prefix = "/api/v1"
    auth         = true

    [[routes]]
    prefix       = "/api/v1/ws/sessions"
    upstream     = "orchestrator"
    strip_prefix = "/api/v1"
    auth         = true
    websocket    = true

    [[routes]]
    prefix       = "/api/v1/ai"
    upstream     = "ai"
    strip_prefix = "/api/v1/ai"
    auth         = true
---
apiVersion: v1
kind: Service
metadata:
  name: ai
  namespace: ktk-app
spec:
  type: ExternalName
  externalName: ai-service.ktk-ai.svc.cluster.local
---
apiVersion: v1
