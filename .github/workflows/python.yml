name: Python CI

on:
  push:
    branches: [master]
    paths:
      - 'services/python/**'
      - 'libs/**'
      - '.github/workflows/python.yml'
  pull_request:
    branches: [master]
    paths:
      - 'services/python/**'
      - 'libs/**'
      - '.github/workflows/python.yml'

jobs:
  lint-test:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add future Python packages here (e.g. services/python/foo, libs/py-common when .py sources exist).
          - package: ai
            workdir: services/python/ai
            lint: make lint
            test: make test
          - package: sim-engine
            workdir: services/python/sim-engine
            lint: make lint
            test: make test

    defaults:
      run:
        working-directory: ${{ matrix.workdir }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            ${{ matrix.workdir }}/requirements.txt
            ${{ matrix.workdir }}/requirements-dev.txt

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          elif [ ! -f requirements.txt ]; then
            pip install ruff mypy pytest
            pip install -e . 2>/dev/null || true
          fi

      - name: Lint
        run: ${{ matrix.lint }}

      - name: Test
        run: ${{ matrix.test }}
