# Локальный конфиг gw-сервиса (API Gateway / BFF)
# Upstream'ы указывают на внутренние сервисы по именам compose-сети.

[http]
addr              = ":8080"
read_timeout      = "10s"
write_timeout     = "30s"
shutdown_timeout  = "15s"

[auth_client]
url               = "http://auth:8080/introspect"
timeout           = "3s"
cache_ttl         = "30s"
cache_max_size    = 1000

[security]
# Local compose: live Playwright + API helpers need headroom (prod stays lower in deploy example).
rate_limit_per_min = 2000

[upstreams.auth]
url = "http://auth:8080"

[upstreams.constructor]
url = "http://constructor:8080"

[upstreams.scenario]
url = "http://scenario:8080"

[upstreams.orchestrator]
url = "http://orchestrator:8080"

[upstreams.assessment]
url = "http://assessment:8080"

[upstreams.snapshot]
url = "http://snapshot:8080"

[upstreams.report]
url = "http://report:8080"

# --- Маршруты (таблица маршрутизации /api/v1/* → upstream) ---
# auth = true → проверка JWT через introspect + инъекция X-User-ID/X-Roles
# roles = [...] → RBAC (только указанные роли)
# strip_prefix → префикс, вырезаемый перед проксированием
# websocket = true → проксирование WS-upgrade

# --- Auth (public + any) ---
[[routes]]
prefix       = "/api/v1/auth/login"
upstream     = "auth"
strip_prefix = "/api/v1/auth"
auth         = false

[[routes]]
prefix       = "/api/v1/auth/refresh"
upstream     = "auth"
strip_prefix = "/api/v1/auth"
auth         = false

[[routes]]
prefix       = "/api/v1/auth/mfa/enrollment"
upstream     = "auth"
strip_prefix = "/api/v1/auth"
auth         = false

[[routes]]
prefix       = "/api/v1/auth"
upstream     = "auth"
strip_prefix = "/api/v1/auth"
auth         = true

[[routes]]
prefix       = "/api/v1/users"
upstream     = "auth"
strip_prefix = "/api/v1"
auth         = true
roles        = ["admin", "instructor"]

# --- Constructor (instructor/admin) ---
[[routes]]
prefix       = "/api/v1/components"
upstream     = "constructor"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

[[routes]]
prefix       = "/api/v1/templates"
upstream     = "constructor"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

# --- Scenario (instructor/admin) ---
[[routes]]
prefix       = "/api/v1/scenarios"
upstream     = "scenario"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

[[routes]]
prefix       = "/api/v1/faults"
upstream     = "scenario"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

# --- Sessions (instructor/operator) ---
[[routes]]
prefix       = "/api/v1/sessions"
upstream     = "orchestrator"
strip_prefix = "/api/v1"
auth         = true

# --- Assessment (instructor/admin) ---
[[routes]]
prefix       = "/api/v1/assessment"
upstream     = "assessment"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

# --- Snapshots metadata (instructor/admin) ---
[[routes]]
prefix       = "/api/v1/snapshots"
upstream     = "snapshot"
strip_prefix = "/api/v1"
auth         = true
roles        = ["instructor", "admin"]

# --- Reports (instructor/operator) ---
[[routes]]
prefix       = "/api/v1/reports"
upstream     = "report"
strip_prefix = "/api/v1"
auth         = true

# --- WebSocket (orchestrator) ---
[[routes]]
prefix       = "/api/v1/ws/sessions"
upstream     = "orchestrator"
strip_prefix = "/api/v1"
auth         = true
websocket    = true
