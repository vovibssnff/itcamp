[http]
addr              = ":8080"
read_timeout      = "10s"
write_timeout     = "30s"
shutdown_timeout  = "15s"

[db]
dsn               = "postgres://picodata:picodata@localhost:5432/ktc?sslmode=disable"
max_conns         = 10
min_conns         = 2
conn_timeout      = "5s"
query_timeout     = "5s"

[redis]
addr              = "localhost:6379"
password          = ""
db                = 0

[nats]
url               = "nats://localhost:4222"

[clients]
constructor_url   = "http://constructor.ktc-app.svc.cluster.local:8080"
scenario_url      = "http://scenario.ktc-app.svc.cluster.local:8080"
sim_url           = "sim.ktc-sim.svc.cluster.local:50051"
assessment_url    = "http://assessment.ktc-app.svc.cluster.local:8080"
snapshot_url      = "snapshot.ktc-app.svc.cluster.local:50052"

[telemetry]
hz                = 1.0
tick_timeout      = "2s"
