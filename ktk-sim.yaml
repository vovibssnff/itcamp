apiVersion: v1
kind: Namespace
metadata:
  name: ktk-sim
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sim-manager-config
  namespace: ktk-sim
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "10s"
    shutdown_timeout  = "15s"

    [provider]
    type              = "docker"
    docker_host       = "unix:///var/run/docker.sock"
    worker_image      = "sim-worker:latest"
    port_base         = 50060
    max_instances     = 50
    cpu_request       = "1000m"
    mem_request       = "512Mi"
    network           = "ktc-data"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-manager
  namespace: ktk-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-manager
  template:
    metadata:
      labels:
        app: sim-manager
    spec:
      containers:
        - name: sim-manager
          image: registry.example.local/ktk-sim/sim-manager:latest
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
            - name: docker-sock
              mountPath: /var/run/docker.sock
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: sim-manager-config
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: sim-manager
  namespace: ktk-sim
spec:
  selector:
    app: sim-manager
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-worker
  namespace: ktk-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim-worker
  template:
    metadata:
      labels:
        app: sim-worker
    spec:
      containers:
        - name: sim-worker
          image: registry.example.local/ktk-sim/sim-worker:latest
          ports:
            - containerPort: 8081
              name: rest
            - containerPort: 50061
              name: grpc
          env:
            - name: KTC_SIM_DATA_DIR
              value: /app/data
            - name: KTC_SIM_TEMPLATE_FILE
              value: template_atm_demo.json
            - name: KTC_SIM_FAULTS_FILE
              value: faults_catalog.json
            - name: KTC_SIM_TICK_HZ
              value: "1.0"
            - name: KTC_SIM_DEFAULT_SEED
              value: "42"
            - name: KTC_SIM_REST_PORT
              value: "8081"
            - name: KTC_SIM_GRPC_PORT
              value: "50061"
          resources:
            requests:
              cpu: 1000m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: sim-worker
  namespace: ktk-sim
spec:
  selector:
    app: sim-worker
  ports:
    - name: rest
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50061
      targetPort: 50061
