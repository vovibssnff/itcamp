apiVersion: v1
kind: Namespace
metadata:
  name: ktk-app
---
apiVersion: v1
kind: Secret
metadata:
  name: ktk-app-secrets
  namespace: ktk-app
type: Opaque
stringData:
  DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  AUTH_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  CONSTRUCTOR_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  SCENARIO_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  ORCHESTRATOR_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  ASSESSMENT_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  SNAPSHOT_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  REPORT_DB_DSN: "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
  AUTH_JWT_SIGNING_KEY: "dev-only-signing-key-please-change-1234567890"
  AUTH_TOTP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef"
  AUTH_MFA_DISABLED: "true"
  S3_ENDPOINT: "minio:9000"
  S3_ACCESS_KEY: "ktcminio"
  S3_SECRET_KEY: "ktcminio_secret"
  NATS_URL: "nats://nats:4222"
  REDIS_ADDR: "radix:7379"
  GW_AUTH_URL: "http://auth:8080/introspect"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "10s"
    shutdown_timeout  = "15s"

    [db]
    dsn               = "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
    max_conns         = 10
    min_conns         = 2
    conn_timeout      = "5s"
    query_timeout     = "5s"

    [jwt]
    signing_key       = "dev-only-signing-key-please-change-1234567890"
    signing_method    = "HS256"
    access_ttl        = "15m"
    refresh_ttl       = "24h"
    issuer            = "ktc-auth"

    [auth]
    mode = "stub"

    [[auth.stub_users]]
    login     = "admin"
    password  = "admin123"
    full_name = "Администратор"
    roles     = ["admin"]

    [[auth.stub_users]]
    login     = "instructor"
    password  = "instructor123"
    full_name = "Инструктор"
    roles     = ["instructor"]

    [[auth.stub_users]]
    login     = "operator"
    password  = "operator123"
    full_name = "Оператор"
    roles     = ["operator"]

    [ldap]
    url               = "ldaps://dc01.corp.example.ru:636"
    bind_dn           = "CN=svc-ktc,OU=ServiceAccounts,DC=corp,DC=example,DC=ru"
    bind_password     = ""
    base_dn           = "DC=corp,DC=example,DC=ru"
    user_filter       = "(sAMAccountName=%s)"
    group_attr        = "memberOf"
    start_tls         = true
    skip_verify       = false
    timeout           = "5s"
    admin_group       = "CN=ktc-admins,OU=Groups,DC=corp,DC=example,DC=ru"
    instructor_group  = "CN=ktc-instructors,OU=Groups,DC=corp,DC=example,DC=ru"
    operator_group    = "CN=ktc-operators,OU=Groups,DC=corp,DC=example,DC=ru"

    [pam]
    enabled           = false
    endpoint          = "https://pam.ktc-app.svc.cluster.local"

    [security]
    password_min_len   = 8
    lockout_threshold  = 10000
    lockout_window     = "15m"
    lockout_duration   = "30m"
    auth_rate_limit    = 10000
    rate_limit_window  = "1m"
    mfa_disabled       = true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: constructor-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "10s"
    shutdown_timeout  = "15s"

    [db]
    dsn               = "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
    max_conns         = 10
    min_conns         = 2
    conn_timeout      = "5s"
    query_timeout     = "5s"

    [s3]
    endpoint          = "minio:9000"
    bucket            = "component-icons"
    access_key        = "ktcminio"
    secret_key        = "ktcminio_secret"
    use_ssl           = false

    [seed]
    enabled           = true
    seed_file         = ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scenario-config
  namespace: ktk-app
data:
  config.toml: |
    [http]
    addr              = ":8080"
    read_timeout      = "10s"
    write_timeout     = "10s"
    shutdown_timeout  = "15s"

    [db]
    dsn               = "postgres://admin:T0psecret@picodata:4327/postgres?sslmode=disable"
