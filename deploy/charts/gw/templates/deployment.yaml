apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gw.fullname" . }}-conf
  labels:
    {{- include "gw.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 80;
      server_name _;

      location = /healthz {
        default_type text/plain;
        return 200 'ok\n';
      }

      location = /readyz {
        default_type text/plain;
        return 200 'ok\n';
      }

      location /api/v1/ {
        default_type application/problem+json;
        return 503 '{"title":"upstream not deployed","status":503}\n';
      }

      location / {
        default_type text/plain;
        return 200 'ktc gateway\n';
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gw.fullname" . }}
  labels:
    {{- include "gw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gw.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: angie
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/angie/http.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: conf
          configMap:
            name: {{ include "gw.fullname" . }}-conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gw.fullname" . }}
  labels:
    {{- include "gw.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "gw.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
