# Example inventory. Real file is generated by terraform apply
# (infra/terraform/inventory.tf → inventory/prod/hosts.ini).

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/ktc_ed25519
ktc_domain=ktk.example.ru
ktc_ingress_fip=203.0.113.10
ktc_cluster_name=ktc-prod

[app]
app-0 ansible_host=10.20.0.11 ktc_role=app
app-1 ansible_host=10.20.0.12 ktc_role=app

[sim]
sim-0 ansible_host=10.20.0.21 ktc_role=sim
sim-1 ansible_host=10.20.0.22 ktc_role=sim

[ai]
# ai-0 ansible_host=10.20.0.31 ktc_role=ai

[db]
db-0 ansible_host=10.20.0.41 ktc_role=db
db-1 ansible_host=10.20.0.42 ktc_role=db
db-2 ansible_host=10.20.0.43 ktc_role=db

[static:children]
app
sim
ai
db
