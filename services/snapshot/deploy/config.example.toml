[http]
addr              = ":8080"
read_timeout      = "10s"
write_timeout     = "30s"
shutdown_timeout  = "15s"

[db]
dsn               = "postgres://picodata:picodata@localhost:5432/ktc?sslmode=disable"
max_conns         = 10
min_conns         = 2
conn_timeout      = "5s"
query_timeout     = "5s"

[s3]
endpoint          = "minio.ktc-data.svc.cluster.local:9000"
bucket            = "snapshots"
access_key        = "minioadmin"
secret_key        = "minioadmin"
use_ssl           = false
region            = "us-east-1"
