# ─────────────────────────────────────────────────────────────
# Слой ktc-app: сервисы приложения ktc (auth..gw).
#
# Требуется data-plane: поднимите инфраструктурный compose
#   compose/data/compose.yaml  →  сеть ktc-data (PostgreSQL, MinIO, NATS, Redis)
#
# Запуск:
#   cp .env.example .env
#   cd ../data && docker compose up -d   # data-plane
#   cd ../app && docker compose up -d --build
#
# Проверка: см. ../helper/*.http
# ─────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-ktc-dev}

# Сеть external: создаётся инфраструктурным compose (infra/local)
networks:
  ktc-data:
    external: true
    name: ${DATA_NETWORK:-ktc-data}
  # Внутренняя сеть для DNS между сервисами приложения
  dev-app:
    driver: bridge

services:
  # ── Auth (stub-режим; пользователи в конфиге) ─────────────
  auth:
    build:
      context: ../../services/go
      dockerfile: auth/deploy/Dockerfile
    environment:
      AUTH_DB_DSN: ${DB_DSN}
      AUTH_JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      AUTH_TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
    volumes:
      - ./config/auth.toml:/app/config.toml:ro
    ports:
      - "${HTTP_AUTH:-8082}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Constructor ────────────────────────────────────────────
  constructor:
    build:
      context: ../../services/go
      dockerfile: constructor/deploy/Dockerfile
    environment:
      CONSTRUCTOR_DB_DSN: ${DB_DSN}
    volumes:
      - ./config/constructor.toml:/app/config.toml:ro
    ports:
      - "${HTTP_CONSTRUCTOR:-8083}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Scenario ───────────────────────────────────────────────
  scenario:
    build:
      context: ../../services/go
      dockerfile: scenario/deploy/Dockerfile
    environment:
      SCENARIO_DB_DSN: ${DB_DSN}
    volumes:
      - ./config/scenario.toml:/app/config.toml:ro
    ports:
      - "${HTTP_SCENARIO:-8084}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Orchestrator ───────────────────────────────────────────
  orchestrator:
    build:
      context: ../../services/go
      dockerfile: orchestrator/deploy/Dockerfile
    environment:
      ORCHESTRATOR_DB_DSN: ${DB_DSN}
      ORCHESTRATOR_NATS_URL: ${NATS_URL}
      ORCHESTRATOR_REDIS_ADDR: ${REDIS_ADDR}
    volumes:
      - ./config/orchestrator.toml:/app/config.toml:ro
    ports:
      - "${HTTP_ORCHESTRATOR:-8085}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Assessment ─────────────────────────────────────────────
  assessment:
    build:
      context: ../../services/go
      dockerfile: assessment/deploy/Dockerfile
    environment:
      ASSESSMENT_DB_DSN: ${DB_DSN}
    volumes:
      - ./config/assessment.toml:/app/config.toml:ro
    ports:
      - "${HTTP_ASSESSMENT:-8081}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Snapshot ───────────────────────────────────────────────
  snapshot:
    build:
      context: ../../services/go
      dockerfile: snapshot/deploy/Dockerfile
    environment:
      SNAPSHOT_DB_DSN: ${DB_DSN}
      SNAPSHOT_S3_ENDPOINT: ${S3_ENDPOINT}
      SNAPSHOT_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      SNAPSHOT_S3_SECRET_KEY: ${S3_SECRET_KEY}
    volumes:
      - ./config/snapshot.toml:/app/config.toml:ro
    ports:
      - "${HTTP_SNAPSHOT:-8086}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Report ─────────────────────────────────────────────────
  report:
    build:
      context: ../../services/go
      dockerfile: report/deploy/Dockerfile
    environment:
      REPORT_DB_DSN: ${DB_DSN}
      REPORT_NATS_URL: ${NATS_URL}
    volumes:
      - ./config/report.toml:/app/config.toml:ro
    ports:
      - "${HTTP_REPORT:-8087}:8080"
    networks: [dev-app, ktc-data]
    restart: unless-stopped

  # ── Gateway (BFF, единая точка входа) ─────────────────────
  gw:
    build:
      context: ../../services/go
      dockerfile: gw/deploy/Dockerfile
    environment:
      GW_AUTH_URL: http://auth:8080/introspect
    volumes:
      - ./config/gw.toml:/app/config.toml:ro
    ports:
      - "${HTTP_GW:-8088}:8080"
    networks: [dev-app, ktc-data]
    depends_on:
      - auth
      - constructor
      - scenario
      - orchestrator
      - assessment
      - snapshot
      - report
    restart: unless-stopped

  # ── Frontend SPA (Angie static + /api proxy → gw) ─────────
  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
        VITE_WS_BASE_URL: ""
        VITE_MOCK_API: "false"
    ports:
      - "${HTTP_FRONTEND:-8090}:8080"
    networks: [dev-app, ktc-data]
    depends_on:
      - gw
    restart: unless-stopped
