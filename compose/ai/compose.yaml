# ─────────────────────────────────────────────────────────────
# Namespace ktk-ai: ИИ-сервис + Ollama.
#
# Эмулирует отдельный Deckhouse-namespace.
# Сеть ktc-data — external, создаётся слоем compose/data.
#
# Запуск:
#   cp .env.example .env        # отредактируйте при необходимости
#   docker compose up -d --build
#   docker compose exec ollama ollama pull qwen2.5:14b-instruct
#
# После подъёма ai-service доступен из namespace ktc-dev по DNS-имени "ai"
# (network alias на сети ktc-data) → gw проксирует /api/v1/ai/* → /v1/*.
# ─────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-ktk-ai}

networks:
  ktc-data:
    external: true
    name: ${DATA_NETWORK:-ktc-data}

services:
  # ── Ollama LLM runtime ────────────────────────────────────────────────────
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks: [ktc-data]
    restart: unless-stopped
    # Раскомментируйте при наличии NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── AI service (knowledge base chat, alarm hints) ──────────────────────────
  # Network alias "ai" позволяет gw из namespace ktc-dev обращаться
  # по URL http://ai:8080 через общую сеть ktc-data.
  ai-service:
    build:
      context: ../../services/python/ai
      dockerfile: Dockerfile
    ports:
      - "${AI_HTTP_HOST_PORT:-8089}:8080"
      - "${AI_GRPC_HOST_PORT:-50051}:50051"
    environment:
      KTK_LLM_PROVIDER: ${KTK_LLM_PROVIDER:-ollama}
      KTK_OLLAMA_URL: ${KTK_OLLAMA_URL:-http://ollama:11434}
      KTK_LLM_MODEL: ${KTK_LLM_MODEL:-qwen2.5:14b-instruct}
      KTK_DOCS_DIR: /app/data/regulation
      KTK_DATA_DIR: /app/data
      KTK_CHAT_IN_EXAM: ${KTK_CHAT_IN_EXAM:-true}
    depends_on:
      - ollama
    networks:
      ktc-data:
        aliases: [ai]   # DNS-имя внутри ktc-data → http://ai:8080 из gw
    restart: unless-stopped

volumes:
  ollama-models:
