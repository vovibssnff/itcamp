# Production uses Go BFF (services/go/gw). Legacy Angie stub templates remain unused when dependency is used.
ktc-service:
  name: gw
  image:
    repository: ""
    tag: latest
  replicaCount: 2
  service:
    port: 80
  nodeSelector:
    ktc.role: app
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
