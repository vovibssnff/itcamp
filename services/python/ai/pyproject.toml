[project]
name = "ktk-ai-service"
version = "1.0.0"
description = "ИИ-модуль Конструктора компьютерных тренажёрных комплексов (ЭЛОУ-АВТ)"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
# Prompt templates and env-backed field defaults are often naturally long.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
