---
- name: Apply seed Job (constructor / scenario loaders)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig_path }}"
    state: present
    definition: "{{ lookup('template', 'seed-job.yaml.j2') | from_yaml }}"

- name: Wait for seed Job
  ansible.builtin.command: >
    kubectl --kubeconfig {{ kubeconfig_path }} -n ktc-app
    wait --for=condition=complete job/ktc-seeds --timeout=600s
  register: seed_wait
  changed_when: false
  failed_when: false

- name: Seed status
  ansible.builtin.debug:
    msg: >-
      Seed job result: {{ seed_wait.rc }}.
      Ensure services/go/constructor/seeds and scenario seeds are packaged into seed image.
