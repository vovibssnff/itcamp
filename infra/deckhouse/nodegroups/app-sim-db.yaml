# Post-bootstrap NodeGroups / InstanceClasses (if not fully defined in config.yml).
# Apply: kubectl apply -f nodegroups/
apiVersion: deckhouse.io/v1
kind: OpenStackInstanceClass
metadata:
  name: app
spec:
  flavorName: STD3-4-8
  imageName: ubuntu-22-04-cloudamd64
  rootDiskSize: 50
  volumeTypeMap:
    MS1: high-iops
---
apiVersion: deckhouse.io/v1
kind: NodeGroup
metadata:
  name: app
spec:
  nodeType: CloudEphemeral
  cloudInstances:
    classReference:
      kind: OpenStackInstanceClass
      name: app
    minPerZone: 1
    maxPerZone: 4
    zones: ["MS1"]
  nodeTemplate:
    labels:
      ktc.role: app
---
apiVersion: deckhouse.io/v1
kind: OpenStackInstanceClass
metadata:
  name: sim
spec:
  flavorName: STD3-8-16
  imageName: ubuntu-22-04-cloudamd64
  rootDiskSize: 50
  volumeTypeMap:
    MS1: high-iops
---
apiVersion: deckhouse.io/v1
kind: NodeGroup
metadata:
  name: sim
spec:
  nodeType: CloudEphemeral
  cloudInstances:
    classReference:
      kind: OpenStackInstanceClass
      name: sim
    minPerZone: 1
    maxPerZone: 6
    zones: ["MS1"]
  nodeTemplate:
    labels:
      ktc.role: sim
    taints:
      - key: sim
        value: "true"
        effect: NoSchedule
---
apiVersion: deckhouse.io/v1
kind: OpenStackInstanceClass
metadata:
  name: db
spec:
  flavorName: STD3-4-16
  imageName: ubuntu-22-04-cloudamd64
  rootDiskSize: 100
  volumeTypeMap:
    MS1: high-iops
---
apiVersion: deckhouse.io/v1
kind: NodeGroup
metadata:
  name: db
spec:
  nodeType: CloudEphemeral
  cloudInstances:
    classReference:
      kind: OpenStackInstanceClass
      name: db
    minPerZone: 2
    maxPerZone: 3
    zones: ["MS1"]
  nodeTemplate:
    labels:
      ktc.role: db
---
