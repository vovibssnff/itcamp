  namespace: ktk-app
spec:
  type: ExternalName
  externalName: sim-worker.ktk-sim.svc.cluster.local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ktk-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: registry.example.local/ktk-app/auth:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: ktk-app-secrets
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: auth-config
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ktk-app
spec:
  selector:
    app: auth
  ports:
    - port: 8080
      targetPort: 8080
