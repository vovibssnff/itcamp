[project]
name = "ktk-sim-worker"
version = "1.0.0"
description = "sim-worker: цифровой двойник ЭЛОУ-АВТ (Model API / матмодель L1) Конструктора КТК"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["src/sim_engine/api/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/context.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
